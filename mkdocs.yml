site_name: polars-hash
site_description: Stable non-cryptographic and cryptographic hashing functions for Polars
site_url: https://ion-elgreco.github.io/polars-hash/
repo_url: https://github.com/ion-elgreco/polars-hash
repo_name: polars-hash

extra:
  version:
    provider: mike

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - search.highlight
    - search.share
    - toc.follow
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - API Reference:
      - Overview: api-reference/index.md
      - chash — Cryptographic: api-reference/cryptographic.md
      - nchash — Non-cryptographic: api-reference/non-cryptographic.md
      - geohash — Geohash: api-reference/geohash.md
      - h3 — H3 index: api-reference/h3.md
      - uuidhash — UUID: api-reference/uuid.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - toc:
      permalink: true
