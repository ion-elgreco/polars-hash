site_name: polars-hash
site_description: Stable non-cryptographic and cryptographic hashing functions for Polars
site_url: https://ion-elgreco.github.io/polars-hash/
repo_url: https://github.com/ion-elgreco/polars-hash
repo_name: polars-hash

extra:
  version:
    provider: mike

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - search.highlight
    - search.share
    - toc.follow
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top

# The API reference is generated from the docstrings in `polars_hash/__init__.py`.
# `paths` is relative to this file and points at the maturin project, whose
# `polars_hash` package griffe reads statically: no import, so the docs build needs
# no compiled plugin.
plugins:
  - mkdocstrings:
      handlers:
        python:
          paths: [polars_hash]
          options:
            docstring_style: google
            docstring_section_style: table
            filters: ["!^_"]
            heading_level: 2
            members_order: source
            separate_signature: true
            show_root_full_path: false
            show_root_heading: false
            show_root_toc_entry: false
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - API Reference:
      - Overview: api-reference/index.md
      - chash — Cryptographic: api-reference/cryptographic.md
      - nchash — Non-cryptographic: api-reference/non-cryptographic.md
      - bytes — Byte encoding: api-reference/bytes.md
      - geohash — Geohash: api-reference/geohash.md
      - h3 — H3 index: api-reference/h3.md
      - timehash — Time bucket: api-reference/timehash.md
      - uuidhash — UUID: api-reference/uuid.md
      - Rows — whole-row hashing: api-reference/rows.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - toc:
      permalink: true
