name: CI

on:
  merge_group:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  tests:
    # A calling job caps the called workflow's job permissions.
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
