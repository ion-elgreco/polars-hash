name: test

on:
  workflow_call:
    inputs:
      cache:
        description: Restore the cargo registry and sccache.
        type: boolean
        default: true

permissions: {}

env:
  # sccache cannot cache incrementally compiled artifacts.
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  tests:
    name: tests ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Native runners only — these build the extension and execute the suite,
        # so a target has to be one the runner can actually run.
        include:
          - { platform: linux-x86_64, runner: ubuntu-latest }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm }
          - { platform: windows-x64, runner: windows-latest }
          - { platform: macos-aarch64, runner: macos-latest }
    defaults:
      run:
        working-directory: polars_hash
    env:
      RUSTC_WRAPPER: ${{ inputs.cache && 'sccache' || '' }}
      SCCACHE_GHA_ENABLED: 'true'
      # Fail on a stale uv.lock; local `make venv` re-resolves instead.
      UV_LOCKED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          cache: ${{ inputs.cache }}
          uv: 'true'
          rust-toolchain: 'true'

      - name: Install make
        if: runner.os == 'Windows'
        run: choco install make --version=4.4.1 --no-progress -y

      - run: make test

      # Type and lint checks are OS-independent; one leg is enough.
      - if: matrix.platform == 'linux-x86_64'
        run: make check

      # uv.lock pins the newest polars, so the run above never exercises the floor
      # pyproject.toml promises. Re-run the suite against exactly that floor, reading
      # it from pyproject.toml so the two cannot drift. The wheel is not rebuilt: one
      # build has to work across the whole supported range. Last, since it leaves an
      # older polars in the environment.
      - name: Test against the minimum supported polars
        if: matrix.platform == 'linux-x86_64'
        run: |
          floor=$(grep -oE "polars >= [0-9]+\.[0-9]+\.[0-9]+" pyproject.toml | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          test -n "$floor" || { echo "no polars floor found in pyproject.toml"; exit 1; }
          echo "::group::polars==$floor"
          uv pip install "polars==$floor"
          uv run --no-sync pytest tests/
          echo "::endgroup::"
