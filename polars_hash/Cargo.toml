[package]
name = "polars_hash"
version = "0.6.0"
edition = "2021"

[lib]
name = "polars_hash"
crate-type = ["cdylib"]

[dependencies]
polars = { version = "0.45", features = [
    "dtype-struct",
    "timezones",
    "dtype-i8",
    "dtype-i16",
    "dtype-u8",
    "dtype-u16",
] }
polars-arrow = { version = "0.45" }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"] }
pyo3-polars = { version = "0.19", features = ["derive", "dtype-struct", "dtype-decimal"] }
serde = { version = "1", features = ["derive"] }
wyhash = { version = "0.6.0" }
geohash = { version = "0.13.2" }
sha1 = { version = "0.11.0" }
sha2 = { version = "0.11.0" }
sha3 = { version = "0.12.0" }
# sha3 0.12 moved the SHAKE XOFs out into their own crate.
shake = { version = "0.1.0" }
blake3 = { version = "1.8.5" }
md5 = { version = "0.8.1" }
h3o = { version = "0.10.0" }
xxhash-rust = { version = "0.8.18", features = ["xxh32", "xxh64", "xxh3"] }
mur3 = { version = "0.1.0" }
hex = {version = "0.4"}
uuid = { version = "1.24.0", features = ["v5"] }
farmhash = { version = "1.1.5" }
hmac = { version = "0.13.0" }
timeharsh = { version = "=1.0.0" }


[target.'cfg(target_os = "linux")'.dependencies]
jemallocator = { version = "0.5", features = ["disable_initial_exec_tls"] }
