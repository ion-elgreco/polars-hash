[package]
name = "polars_hash"
version = "0.8.0"
edition = "2021"

[lib]
name = "polars_hash"
crate-type = ["cdylib"]

[dependencies]
# If a data type feature is absent, polars does not only reject that data type. It
# makes a panic when it reads the arrow type, and a panic at the C boundary of the
# plugin stops the process. Therefore use `dtype-full` and not a list. A list must
# grow with polars, and one absent feature stops the interpreter of the user.
# `dtype-full` does not include `object`, which polars always sends as Binary.
polars = { version = "0.54.4", features = ["dtype-full", "timezones"] }
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py310"] }
pyo3-polars = { version = "0.27", features = ["derive", "dtype-full"] }
serde = { version = "1", features = ["derive"] }
wyhash = { version = "0.6.0" }
geohash = { version = "0.13.2" }
sha1 = { version = "0.11.0" }
sha2 = { version = "0.11.0" }
sha3 = { version = "0.12.0" }
# sha3 0.12 moved the SHAKE XOFs out into their own crate.
shake = { version = "0.1.0" }
blake3 = { version = "1.8.5" }
md5 = { version = "0.8.1" }
h3o = { version = "0.10.0" }
xxhash-rust = { version = "0.8.18", features = ["xxh32", "xxh64", "xxh3"] }
mur3 = { version = "0.1.0" }
hex = {version = "0.4"}
uuid = { version = "1.24.0", features = ["v5"] }
farmhash = { version = "1.1.5" }
cityhasher = { version = "=0.1.0", default-features = false }
cityhash-rs = { version = "=1.0.1" }
hmac = { version = "0.13.0" }
timeharsh = { version = "=1.0.0" }
gxhash = { version = "=3.5.0", default-features = false }


[target.'cfg(target_os = "linux")'.dependencies]
jemallocator = { version = "0.5", features = ["disable_initial_exec_tls"] }

[profile.release]
lto = "thin"
codegen-units = 1
