[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "polars-hash"
requires-python = ">=3.10"
dependencies = [
  'polars >= 1.32.0'
]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
authors = [
  { name="Ion Koutsours", email="15728914+ion-elgreco@users.noreply.github.com"},
]
description = "Stable non-cryptographic and cryptographic hashing functions for Polars"
readme = "README.md"
dynamic = ["version"]

[project.urls]
"Homepage" = "https://github.com/ion-elgreco/polars-hash"
"Bug Tracker" = "https://github.com/ion-elgreco/polars-hash/issues"

# Exact versions are pinned by uv.lock; these are the constraints it resolves
# against. `polars` is not repeated here — it is already a runtime dependency.
[dependency-groups]
dev = [
  "maturin>=1.0,<2.0",
  "mypy",
  "pytest",
  "ruff",
]

[tool.maturin]
module-name = "polars_hash._internal"

[tool.ruff]
src = ["polars_hash", "tests"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["polars_hash"]

# Polars' Datetime dtype is time-zone-naive by default, so the tests covering it
# construct naive datetimes on purpose.
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DTZ001"]
